name: Build and Release SheetSort

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          python -m pytest sheetsort/tests/ -v

      - name: Build Windows Executable
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_windows.ps1

      - name: Package Release ZIP
        run: |
          Compress-Archive -Path "dist\SheetSort\*" -DestinationPath "SheetSort-windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SheetSort-windows-x64.zip
          name: SheetSort ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
